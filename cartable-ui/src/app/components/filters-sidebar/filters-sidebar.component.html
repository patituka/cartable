<aside class="col-lg-3 animate-slide-in">
    <div class="card border rounded-4 p-4 sticky-top shadow-sm" style="top: 7rem;">
        <div class="d-flex align-items-center mb-4 text-dark fw-bold justify-content-between">
            <div class="d-flex align-items-center">
                <lucide-icon name="filter" class="me-2 text-primary" [size]="16"></lucide-icon>
                Filtres
            </div>
        </div>

        <div class="d-flex flex-column gap-4">
            <div>
                <label class="d-block small fw-bold text-muted text-uppercase mb-3" style="letter-spacing: 0.05em;">
                    Niveau
                </label>
                <div class="d-flex flex-column gap-2">
                    <label class="d-flex align-items-center cursor-pointer group">
                        <div [class]="'rounded-circle border d-flex align-items-center justify-content-center transition-colors ' + (filters.level === '' ? 'border-primary bg-primary' : 'border-secondary bg-white')"
                            style="width: 1rem; height: 1rem;">
                            @if (filters.level === '') { <div class="bg-white rounded-circle"
                                style="width: 0.375rem; height: 0.375rem;"></div> }
                        </div>
                        <input type="radio" name="level" [checked]="filters.level === ''"
                            (change)="onUpdateLevel.emit('')" class="d-none" />
                        <span
                            [class]="'ms-3 small transition-colors ' + (filters.level === '' ? 'text-dark fw-medium' : 'text-secondary')">Tous</span>
                    </label>
                    @for (level of levels; track level) {
                    <label class="d-flex align-items-center cursor-pointer group">
                        <div [class]="'rounded-circle border d-flex align-items-center justify-content-center transition-colors ' + (filters.level === level ? 'border-primary bg-primary' : 'border-secondary bg-white')"
                            style="width: 1rem; height: 1rem;">
                            @if (filters.level === level) { <div class="bg-white rounded-circle"
                                style="width: 0.375rem; height: 0.375rem;"></div> }
                        </div>
                        <input type="radio" name="level" [value]="level" [checked]="filters.level === level"
                            (change)="onUpdateLevel.emit($any(level))" class="d-none" />
                        <span
                            [class]="'ms-3 small transition-colors ' + (filters.level === level ? 'text-dark fw-medium' : 'text-secondary')">{{level}}</span>
                    </label>
                    }
                </div>
            </div>

            <div>
                <label class="d-block small fw-bold text-muted text-uppercase mb-3" style="letter-spacing: 0.05em;">
                    Matière
                </label>
                <select [ngModel]="filters.subject" (ngModelChange)="onUpdateSubject.emit($any($event))"
                    class="form-select rounded-3 bg-light border-light-subtle shadow-sm">
                    <option value="">Toutes les matières</option>
                    @for (subject of subjects; track subject) {
                    <option [value]="subject">{{subject}}</option>
                    }
                </select>
            </div>
        </div>
    </div>
</aside>
